name: Mnemos CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Lint, Test & Benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mnemos
          POSTGRES_PASSWORD: mnemos_dev_secret
          POSTGRES_DB: mnemos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check src tests benchmarks

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://mnemos:mnemos_dev_secret@localhost:5432/mnemos
          SYNC_DATABASE_URL: postgresql+psycopg://mnemos:mnemos_dev_secret@localhost:5432/mnemos
        run: |
          alembic upgrade head

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://mnemos:mnemos_dev_secret@localhost:5432/mnemos
          SYNC_DATABASE_URL: postgresql+psycopg://mnemos:mnemos_dev_secret@localhost:5432/mnemos
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          LOG_LEVEL: INFO
        run: |
          pytest -v

      - name: Run Benchmark Evaluation
        env:
          DATABASE_URL: postgresql+asyncpg://mnemos:mnemos_dev_secret@localhost:5432/mnemos
          SYNC_DATABASE_URL: postgresql+psycopg://mnemos:mnemos_dev_secret@localhost:5432/mnemos
          REDIS_URL: redis://localhost:6379/0
        run: |
          python benchmarks/runner.py

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Install Console Dependencies
        run: |
          cd console
          npm ci

      - name: Build & Type-Check Console
        run: |
          cd console
          npm run build
